basePath: /api
definitions:
  handle.ErrorResponse:
    properties:
      error:
        example: invalid id
        type: string
    type: object
  handle.TransactionListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Transaction'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  handle.categoryInput:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  handle.transactionInput:
    properties:
      amount_minor:
        type: integer
      category_id:
        type: integer
      occurred_at:
        description: по умолчанию — текущее время
        type: string
      type:
        $ref: '#/definitions/models.TransactionType'
    required:
    - amount_minor
    - category_id
    - type
    type: object
  models.Balance:
    properties:
      balance_minor:
        type: integer
      expense_minor:
        type: integer
      income_minor:
        type: integer
    type: object
  models.Category:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  models.CategoryStat:
    properties:
      category_id:
        type: integer
      category_name:
        type: string
      total_minor:
        type: integer
    type: object
  models.MonthlyStat:
    properties:
      balance_minor:
        type: integer
      expense_minor:
        type: integer
      income_minor:
        type: integer
      month:
        type: integer
      net_minor:
        type: integer
      year:
        type: integer
    type: object
  models.Transaction:
    properties:
      amount_minor:
        type: integer
      category:
        $ref: '#/definitions/models.Category'
      category_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      occurred_at:
        type: string
      type:
        $ref: '#/definitions/models.TransactionType'
      updated_at:
        type: string
    type: object
  models.TransactionType:
    enum:
    - income
    - expense
    type: string
    x-enum-varnames:
    - TransactionIncome
    - TransactionExpense
host: localhost:8080
info:
  contact:
    email: abubakir72273313@gmail.com
    name: API Support
  description: 'API учёта финансов: категории, транзакции и статистика (суммы хранятся
    в минорных единицах, например в копейках/центах).'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Finance Tracker API
  version: "1.0"
paths:
  /categories:
    get:
      description: Отсортирован по имени.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Category'
            type: array
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
      summary: Список категорий
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Имя уникально, до 100 символов.
      parameters:
      - description: Данные категории
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handle.categoryInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Category'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "409":
          description: Конфликт
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
      summary: Создать категорию
      tags:
      - categories
  /categories/{id}:
    delete:
      description: Нельзя удалить категорию, у которой есть транзакции.
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Удалено
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "404":
          description: Не найдено
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "409":
          description: Конфликт
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
      summary: Удалить категорию
      tags:
      - categories
    get:
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Category'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "404":
          description: Не найдено
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
      summary: Получить категорию по ID
      tags:
      - categories
    put:
      consumes:
      - application/json
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: integer
      - description: Новое имя
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handle.categoryInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Category'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "404":
          description: Не найдено
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "409":
          description: Конфликт
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
      summary: Обновить категорию
      tags:
      - categories
  /statistics/balance:
    get:
      description: Доход, расход и баланс (доход − расход). Без параметров — за всё
        время.
      parameters:
      - description: Начало периода (RFC3339 или YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Конец периода (RFC3339 или YYYY-MM-DD, дата включается целиком)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Balance'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
      summary: Баланс за период
      tags:
      - statistics
  /statistics/categories:
    get:
      description: Суммы по категориям за период по убыванию. type по умолчанию expense.
      parameters:
      - description: Начало периода (RFC3339 или YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Конец периода (RFC3339 или YYYY-MM-DD, дата включается целиком)
        in: query
        name: to
        type: string
      - default: expense
        description: Тип
        enum:
        - income
        - expense
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CategoryStat'
            type: array
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
      summary: Суммы по категориям
      tags:
      - statistics
  /statistics/monthly:
    get:
      description: 12 месяцев года (UTC). net_minor — доход−расход за месяц, balance_minor
        — накопленный баланс на конец месяца.
      parameters:
      - description: Год (по умолчанию текущий)
        in: query
        maximum: 9999
        minimum: 1970
        name: year
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.MonthlyStat'
            type: array
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
      summary: Статистика по месяцам
      tags:
      - statistics
  /transactions:
    get:
      description: Фильтры и пагинация (limit по умолчанию 20, максимум 100).
      parameters:
      - description: Начало периода (RFC3339 или YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Конец периода (RFC3339 или YYYY-MM-DD, дата включается целиком)
        in: query
        name: to
        type: string
      - description: ID категории
        in: query
        name: category_id
        type: integer
      - description: Тип
        enum:
        - income
        - expense
        in: query
        name: type
        type: string
      - default: 20
        description: Размер страницы
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Смещение
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handle.TransactionListResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
      summary: Список транзакций
      tags:
      - transactions
    post:
      consumes:
      - application/json
      description: occurred_at по умолчанию — текущее время (UTC).
      parameters:
      - description: Данные транзакции
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handle.transactionInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Transaction'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "422":
          description: Категория не существует
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
      summary: Создать транзакцию
      tags:
      - transactions
  /transactions/{id}:
    delete:
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Удалено
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "404":
          description: Не найдено
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
      summary: Удалить транзакцию
      tags:
      - transactions
    get:
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Transaction'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "404":
          description: Не найдено
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
      summary: Получить транзакцию по ID
      tags:
      - transactions
    put:
      consumes:
      - application/json
      description: Полная замена полей; если occurred_at не передан — не меняется.
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: integer
      - description: Данные транзакции
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handle.transactionInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Transaction'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "404":
          description: Не найдено
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "422":
          description: Категория не существует
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handle.ErrorResponse'
      summary: Обновить транзакцию
      tags:
      - transactions
schemes:
- http
swagger: "2.0"
